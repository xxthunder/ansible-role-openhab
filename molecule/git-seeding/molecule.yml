---
# Focused scenario for the two-repo git wiring (ARO-002).
#
# Deliberately narrow: it converges tasks/git.yml alone, never the whole role,
# so it needs no docker-in-docker for the openHAB container and no git server.
# The "remote" is a bare repo created inside the container, reached over
# file://, which keeps the scenario hermetic -- no network, no credentials,
# nothing to leak.
#
# The image is pinned by digest, not by a moving tag, so a run today and a run
# next month test the same base system. Bump it deliberately.
#
# The sequence names only the steps this scenario has playbooks for. The
# collections come from the repo-root requirements.yml via scripts/test.sh, so
# there is no dependency step; there is no cleanup and no side effect.
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
driver:
  name: docker
platforms:
  - name: openhab-git-seeding
    image: geerlingguy/docker-debian12-ansible@sha256:43b3f59882ccc0ba5deb3b3ecac727084bb082a3230b5258c500395694b5497f
    pre_build_image: true
provisioner:
  name: ansible
  env:
    # The checkout is the role, named after its directory (converge.yml), so
    # its parent goes on the roles path.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      openhab-git-seeding:
        openhab_home: /opt/docker/openhab
        openhab_conf_repo: "file:///srv/fake-remotes/conf.git"
        openhab_conf_repo_branch: develop
        openhab_state_repo: "file:///srv/fake-remotes/state.git"
        openhab_state_repo_branch: develop
        openhab_git_user_name: Molecule Operator
        openhab_git_user_email: molecule@example.invalid
        # What ForwardAgent puts into an SSH session: the agent socket, in
        # every command the connection runs. become strips it, as sudo does on
        # a real host. prepare.yml starts the agent behind it.
        ansible_docker_extra_env:
          SSH_AUTH_SOCK: /tmp/forwarded-agent.sock
verifier:
  name: ansible
