---
galaxy_info:
  role_name: openhab
  namespace: xxthunder
  author: xxthunder
  description: >-
    openHAB as a Docker container — creates the service account, seeds conf/
    and userdata/ from two optional git repositories without ever resetting a
    populated tree, and runs the official image with host networking.
  company: xxthunder
  license: MIT
  # The toolchain this role is tested with (pyproject.toml) starts at 2.17.
  min_ansible_version: "2.17"

  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie

  galaxy_tags:
    - openhab
    - smarthome
    - homeautomation
    - docker

dependencies: []
